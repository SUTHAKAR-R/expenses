<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expenses</title>
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#6d4aff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycby2waHOD6wZGMAgEwYe4MriZZ3WduCWWmEjHJfiJHOw1JWA73DlgJhb3x8pzv8QaoIo/exec';
  // "?add" shows the install help and strips itself, so the saved home-screen shortcut opens the app directly.
  if (location.search.indexOf('add') === -1) {
    location.replace(APP_URL);
  } else {
    history.replaceState(null, '', location.pathname);
  }
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; text-align: center;
         background: linear-gradient(135deg, #6d4aff 0%, #b14bf4 55%, #ff6b9a 100%); }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 28px rgba(40, 10, 90, .35); }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  ol { text-align: left; max-width: 300px; margin: 16px auto; padding-left: 22px; }
  a { display: inline-block; margin-top: 8px; padding: 12px 22px; border-radius: 12px; background: #fff; color: #6d4aff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div>
    <img src="icon.png" alt="">
    <h1>Add Expenses to your Home Screen</h1>
    <ol>
      <li><b>iPhone:</b> tap Share <span aria-hidden="true">⬆️</span> → <b>Add to Home Screen</b></li>
      <li><b>Android:</b> tap ⋮ → <b>Add to Home screen</b></li>
    </ol>
    <a id="open" href="#">Open the app</a>
  </div>
  <script>document.getElementById('open').href = APP_URL;</script>
</body>
</html>
